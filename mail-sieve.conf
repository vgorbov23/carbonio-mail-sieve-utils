# Общие настройки mail-sieve. Файл читается как bash-скрипт.

# Папка для общих рассылок: письма с List-Unsubscribe, List-Id или Precedence: bulk/list/junk.
# Одно значение. Регистр имеет значение.
NEWS_FOLDER="Рассылки"

# Дополнительные папки, которые нужно создать в каждом ящике, даже если на них нет правил
# в rules.conf. Это bash-массив: значения в кавычках через пробел, вложенная папка через слэш.
# Пример: EXTRA_FOLDERS=("Антиспам" "Задачи" "redmine/infra")
EXTRA_FOLDERS=()

# Домены, на которые ставится скрипт. Пусто: все домены сервера.
# Пример: DOMAINS="corp.ru example.ru"
DOMAINS=""

# Ящики, которым не создаются папки (регулярное выражение по адресу).
# Системные ящики (zimbraIsSystemAccount=TRUE) пропускаются и без этой настройки.
# На доставку Sieve она не влияет.
EXCLUDE_REGEX='^(galsync|spam\.|ham\.|virus-quarantine\.)'

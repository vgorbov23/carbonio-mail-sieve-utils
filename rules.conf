# Правила: какое письмо в какую папку. Срабатывают первыми и останавливают обработку,
# в том числе для отправителей из белого списка. Поля разделяются точкой с запятой.
#
#   header-exists;ЗАГОЛОВОК;ПАПКА
#   header-contains;ЗАГОЛОВОК;ТЕКСТ;ПАПКА
#   subject-contains;ТЕКСТ;ПАПКА
#   from-domain;ДОМЕН;ПАПКА           точное совпадение, поддомены отдельной строкой
#   from-address;АДРЕС;ПАПКА
#
# Вложенная папка пишется через слэш: redmine/infra.
# Регистр в имени папки должен совпадать с тем, что уже есть у пользователей
# (redmine и Redmine это разные папки). Недостающие папки создаются автоматически.
# Системная папка спама называется Junk, а не Спам.
#
# Имена заголовков смотрите в оригинале письма. Примеры:
# header-exists;X-Redmine-Project;redmine
# header-exists;X-Antispam;Антиспам
# subject-contains;[Антиспам];Антиспам
# from-domain;github.com;GitHub
